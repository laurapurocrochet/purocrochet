<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrones Gratis - Puro Crochet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .banner-fino { height: 35vh; min-height: 240px; overflow: hidden; }
        .banner-fino .imagen-portada { height: 100%; object-fit: cover; }
        .precio-gratis { color: #2e7d32; font-weight: 700; letter-spacing: .4px; font-size: 15px; }
        .grilla-gratis-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 340px));
            gap: 30px;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body data-products-section="gratis">
    <!-- HEADER -->
    <header class="barra-superior">
        <a href="index.html" class="logo-marca">
            <img src="logo.png" alt="Logo Puro Crochet" class="imagen-logo">
        </a>
        <div class="menu-derecha">
            <nav class="categorias">
                <a href="index.html">Inicio</a>
                <a href="Guias de tejido.html">Guías de tejido</a>
                <a href="patrones-gratis.html" class="activo">Patrones gratis</a>
                <a href="contacto.html">Contacto</a>
            </nav>
            <div class="iconos-navegacion">
                <a href="#" class="carrito-contenedor" aria-label="Carrito de compras">
                    <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="contador-rojo">0</span>
                </a>
            </div>
        </div>
    </header>

    <!-- BANNER -->
    <section class="banner-imagen banner-fino">
        <img src="banner-guia.jpg" alt="Patrones gratis de crochet" class="imagen-portada">
        <div class="superposicion-texto">
            <h1 class="frase-cursiva-blanca">Patrones gratis</h1>
        </div>
    </section>

    <!-- MAIN PRODUCTOS GRATIS -->
    <main class="seccion-coleccion">
        <h2 class="titulo-coleccion">PATRONES GRATIS</h2>

        <div class="grilla-productos grilla-gratis-2" data-products-grid>
            <!-- 1. Patrón Pareo (Gratis) -->
            <article class="tarjeta-producto" data-id="gratis-pareo">
                <div class="contenedor-imagen">
                    <a href="javascript:void(0)" class="enlace-detalle-producto">
                        <img src="Pareo foto9.jpeg" alt="Patrón Pareo">
                    </a>
                    <button class="boton-favorito" aria-label="Añadir a favoritos">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>
                <div class="info-producto">
                    <div class="detalles-texto">
                        <h3 class="nombre-producto"><a href="javascript:void(0)" class="enlace-detalle-producto">PATRÓN PAREO</a></h3>
                        <p class="precio-producto precio-gratis">$0 (GRATIS)</p>
                    </div>
                    <button class="boton-agregar-rapido" aria-label="Añadir directo a la bolsa">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="12" y1="10" x2="12" y2="16"></line>
                            <line x1="9" y1="13" x2="15" y2="13"></line>
                        </svg>
                    </button>
                </div>
            </article>

            <!-- 2. Patrón Cuellito (Gratis) -->
            <article class="tarjeta-producto" data-id="gratis-cuellito">
                <div class="contenedor-imagen">
                    <a href="javascript:void(0)" class="enlace-detalle-producto">
                        <img src="cuellito Abrazo foto2.jpeg" alt="Patrón Cuellito">
                    </a>
                    <button class="boton-favorito" aria-label="Añadir a favoritos">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.72-8.72 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                    </button>
                </div>
                <div class="info-producto">
                    <div class="detalles-texto">
                        <h3 class="nombre-producto"><a href="javascript:void(0)" class="enlace-detalle-producto">PATRÓN CUELLITO</a></h3>
                        <p class="precio-producto precio-gratis">$0 (GRATIS)</p>
                    </div>
                    <button class="boton-agregar-rapido" aria-label="Añadir directo a la bolsa">
                        <svg class="icono-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="12" y1="10" x2="12" y2="16"></line>
                            <line x1="9" y1="13" x2="15" y2="13"></line>
                        </svg>
                    </button>
                </div>
            </article>
        </div>
    </main>

    <!-- MODAL DETALLE DE PRODUCTO -->
    <div class="modal-producto-overlay" id="modal-producto-overlay">
        <div class="modal-producto-contenedor" role="dialog" aria-modal="true">
            <button class="modal-cerrar" id="btn-cerrar-modal" aria-label="Cerrar ventana">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="galeria-producto">
                <div class="miniaturas-lista" id="modal-miniaturas"></div>
                <div class="imagen-principal-contenedor">
                    <img id="modal-foto-principal" src="" alt="Foto principal">
                </div>
            </div>
            <div class="info-compra-producto">
                <h2 class="modal-titulo-producto" id="modal-nombre">Nombre</h2>
                <div class="bloque-precio">
                    <div class="modal-precio" id="modal-precio" style="color: #2e7d32;">$0 (GRATIS)</div>
                </div>
                <div class="bloque-stock">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span id="modal-stock">Descarga gratuita inmediata</span>
                </div>
                <ul class="detalles-especificaciones" id="modal-especificaciones"></ul>
                <p class="modal-descripcion" id="modal-descripcion" style="white-space: pre-line;"></p>
                <div class="control-cantidad-contenedor">
                    <label for="modal-input-cantidad">Cantidad:</label>
                    <div class="selector-cantidad">
                        <button type="button" class="btn-cantidad" id="btn-menos-cant" aria-label="Disminuir cantidad">-</button>
                        <input type="text" id="modal-input-cantidad" class="input-cantidad" value="1" readonly>
                        <button type="button" class="btn-cantidad" id="btn-mas-cant" aria-label="Aumentar cantidad">+</button>
                    </div>
                </div>
                <div class="acciones-compra">
                    <button type="button" class="btn-comprar-ahora" id="btn-comprar-ahora">Obtener gratis</button>
                    <button type="button" class="btn-agregar-carrito-modal" id="btn-modal-agregar-carrito">Agregar a la bolsa</button>
                </div>
            </div>
        </div>
    </div>

    <script src="cart.js"></script>
    <script src="custom-products.js"></script>
    <script src="checkout.js"></script>
    <script src="patrones-gratis.js"></script>
</body>
</html>
